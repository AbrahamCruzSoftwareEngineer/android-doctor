name: Public Release Gate

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master" ]

jobs:
  verify-public-free:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Verify public free guardrails
        run: python3 scripts/verify_public_guardrails.py

      - name: Verify Gradle wrapper consistency
        run: gradle verifyWrapperConsistency

      - name: Run check lifecycle
        run: gradle check

      - name: Run doctorTest
        run: gradle doctorTest
